name: de-project

# Profiles let you start only what you need (saves RAM):
#   streaming -> kafka, topic init, producer, spark streaming job
#   batch     -> postgres, airflow (runs dbt + DuckDB)

services:
  # ---------------------------------------------------------------- batch
  postgres:
    image: docker.io/library/postgres:16-alpine
    profiles: ["batch"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    build: ./airflow
    image: localhost/de-airflow:dev
    profiles: ["batch"]
    depends_on:
      - postgres
    # standalone = api-server + scheduler + dag-processor + triggerer in ONE container
    command: ["bash", "/opt/airflow/start.sh"]
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__API_AUTH__JWT_SECRET: dev-only-secret-change-me-dev-only-secret-change-me
      BRONZE_PATH: /opt/airflow/data/bronze/iot_readings
      DUCKDB_PATH: /opt/airflow/data/warehouse/iot.duckdb
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET_PATH: /tmp/dbt_target
      DBT_LOG_PATH: /tmp/dbt_logs
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/start.sh:/opt/airflow/start.sh:ro
      - ./dbt:/opt/airflow/dbt:ro
      - ./scripts:/opt/airflow/scripts:ro
      - ./data:/opt/airflow/data
      - airflow-logs:/opt/airflow/logs
    restart: on-failure

  # ------------------------------------------------------------ streaming
  kafka:
    image: docker.io/apache/kafka:4.3.1
    profiles: ["streaming"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    restart: on-failure

  kafka-init:
    image: docker.io/apache/kafka:4.3.1
    profiles: ["streaming"]
    depends_on:
      - kafka
    command:
      - bash
      - -c
      - >-
        for i in {1..30}; do
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic iot.readings
        --partitions 3 --replication-factor 1 && break;
        sleep 3; done
    restart: "no"

  producer:
    build: ./producer
    image: localhost/de-iot-producer:dev
    profiles: ["streaming"]
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TOPIC: iot.readings
      NUM_SENSORS: "20"
      INTERVAL_SECONDS: "2"
    restart: on-failure

  spark-stream:
    image: docker.io/library/spark:4.1.3-java21-python3
    user: "0:0"
    profiles: ["streaming"]
    depends_on:
      - kafka
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/tmp/ivy
      - --conf
      - spark.sql.ansi.enabled=false
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
      - /app/stream_to_bronze.py
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      TOPIC: iot.readings
    ports:
      - "4040:4040"
    volumes:
      - ./spark:/app:ro
      - ./data:/data
      - ./data/ivy:/tmp/ivy
    restart: on-failure

volumes:
  pgdata:
  airflow-logs:
