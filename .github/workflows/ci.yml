name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: |
          mkdir -p data/warehouse
          python scripts/make_sample_bronze.py data/bronze/iot_readings
      - name: dbt build on sample data
        env:
          BRONZE_PATH: ${{ github.workspace }}/data/bronze/iot_readings
          DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/ci.duckdb
        run: dbt build --project-dir dbt --profiles-dir dbt --target ci

  images:
    needs: [lint-test, dbt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t de-airflow:ci airflow
          docker build -t de-iot-producer:ci producer
      - name: DAG import test (inside the Airflow image)
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/airflow/dags:/opt/airflow/dags:ro" de-airflow:ci -c "
          from airflow.models import DagBag
          bag = DagBag('/opt/airflow/dags', include_examples=False)
          assert not bag.import_errors, bag.import_errors
          print('DAGs OK:', list(bag.dag_ids))
          "
      # --- "CD": publish images to GitHub Container Registry on merge to main ---
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          for img in de-airflow de-iot-producer; do
            docker tag "$img:ci" "$REPO/$img:${GITHUB_SHA}"
            docker tag "$img:ci" "$REPO/$img:latest"
            docker push "$REPO/$img:${GITHUB_SHA}"
            docker push "$REPO/$img:latest"
          done
